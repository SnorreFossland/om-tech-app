name: E2E tests (Playwright)

on:
  pull_request:
    branches: [ 001-batch-process-specs ]
  push:
    branches: [ feature/001-property-sales-platform ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma schema to SQLite (dev)
        run: npx prisma db push

      - name: Start Next dev server
        run: npm run dev &> .next-dev.log & echo $! > .next.pid

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E (serial)
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-dev-log
          path: .next-dev.log
